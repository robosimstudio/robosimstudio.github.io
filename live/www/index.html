<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoboSimStudio Live</title>
<meta name="description" content="Robot simulations running live on GPUs. Drag the robot and feel the physics.">
<style>
  :root {
    --bar: #ffffff; --ink: #18181b; --muted: #6b6b73; --line: #e4e4e0; --tab-on: #18181b;
    --tab-on-ink: #ffffff; --accent: #ff8c00; --live: #16a34a; --wait: #a1a1aa; --stage: #e9e9e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bar: #141416; --ink: #ececee; --muted: #a1a1aa; --line: #2a2a2f; --tab-on: #ececee;
      --tab-on-ink: #141416; --stage: #1b1b1e;
    }
  }
  :root[data-theme="dark"] {
    --bar: #141416; --ink: #ececee; --muted: #a1a1aa; --line: #2a2a2f; --tab-on: #ececee;
    --tab-on-ink: #141416; --stage: #1b1b1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--stage); color: var(--ink); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    padding-top: max(8px, env(safe-area-inset-top)); background: var(--bar); border-bottom: 1px solid var(--line);
  }
  .mark { font-weight: 700; white-space: nowrap; letter-spacing: -0.01em; }
  .mark span { color: var(--accent); }
  nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; cursor: pointer;
  }
  nav button:hover { border-color: var(--muted); }
  nav button[aria-selected="true"] { background: var(--tab-on); border-color: var(--tab-on); color: var(--tab-on-ink); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; }
  .dot.live { background: var(--live); }
  .short { display: none; }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--stage); }
  .note {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px;
    color: var(--muted); background: var(--stage);
  }
  .note.on { display: grid; }
  @media (max-width: 760px) {
    header { gap: 8px; padding-left: 10px; padding-right: 10px; }
    .long { display: none; }
    .short { display: inline; }
    nav button { padding: 6px 10px; }
  }
  @media (max-width: 560px) {
    .mark { display: none; }
    nav { justify-content: space-between; }
    nav button { flex: 1; justify-content: center; }
  }
  @media (max-width: 360px) {
    header { padding-left: 6px; padding-right: 6px; }
    nav { gap: 4px; }
    nav button { padding: 5px 6px; gap: 5px; font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="mark">RoboSimStudio <span>Live</span></div>
  <nav id="tabs" role="tablist" aria-label="Demos"></nav>
</header>
<main>
  <iframe id="demo" title="Live simulation" allow="fullscreen; clipboard-write"></iframe>
  <div class="note" id="note">This simulation is restarting. It will be back in a minute.</div>
</main>
<script>
  // Each demo is one simulation on its own GPU, served at its own subdomain. The page shows one at
  // a time (an open demo is a live stream) and keeps which one in the address (#towel).
  const DEMOS = [
    { id: "bar", title: "Wipe the bar", short: "Wipe" },
    { id: "cable", title: "Route the cable", short: "Cable" },
    { id: "towel", title: "Fold the towel", short: "Towel" },
    { id: "peel", title: "Peel the film", short: "Peel" },
  ];
  const HOST = /sslip\.io$/.test(location.hostname) ? location.hostname : "95-133-252-186.sslip.io";
  const tabs = document.getElementById("tabs");
  const frame = document.getElementById("demo");
  const note = document.getElementById("note");
  const live = {};

  for (const d of DEMOS) {
    const b = document.createElement("button");
    b.setAttribute("role", "tab");
    b.dataset.id = d.id;
    b.innerHTML = `<span class="dot"></span><span class="long">${d.title}</span><span class="short">${d.short}</span>`;
    b.addEventListener("click", () => { location.hash = d.id; });
    tabs.appendChild(b);
  }

  function current() {
    const id = location.hash.slice(1);
    return DEMOS.find((d) => d.id === id) || DEMOS[0];
  }

  function show() {
    const d = current();
    for (const b of tabs.children) b.setAttribute("aria-selected", String(b.dataset.id === d.id));
    tabs.querySelector(`[data-id="${d.id}"]`).scrollIntoView({ block: "nearest", inline: "nearest" });
    const url = `https://${d.id}.${HOST}/`;
    if (frame.dataset.src !== url) {
      frame.dataset.src = url;
      frame.src = url;
    }
    document.title = `${d.title} · RoboSimStudio Live`;
    note.classList.toggle("on", live[d.id] === false);
  }

  // Which simulations answer: the gateway's status route says 204 (up) or 502 (down or restarting).
  // Two misses in a row before a demo counts as down (one lost request on a phone is not an outage),
  // and nothing here reloads the open demo: its page reconnects by itself when the server is back.
  const misses = {};
  async function poll() {
    await Promise.all(DEMOS.map(async (d) => {
      let ok = false;
      try {
        ok = (await fetch(`https://${HOST}/status/${d.id}`, { cache: "no-store" })).ok;
      } catch (e) {
        ok = false;
      }
      misses[d.id] = ok ? 0 : (misses[d.id] || 0) + 1;
      live[d.id] = misses[d.id] < 2;
      tabs.querySelector(`[data-id="${d.id}"] .dot`).classList.toggle("live", ok);
    }));
    show();
  }

  window.addEventListener("hashchange", show);
  show();
  poll();
  setInterval(poll, 20000);
</script>
</body>
</html>
