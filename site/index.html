<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>RoboSimStudio</title>
    <meta name="description" content="Drag the robot. Every frame is simulated by RoboSimStudio; at rest it is path traced." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23ff8c00'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="stage" aria-label="Interactive simulation">
      <div class="plate" id="plate">
        <img class="layer bg" id="bg" alt="" draggable="false" />
        <canvas class="layer ink" id="bg-ink"></canvas>
        <canvas class="layer live" id="live"></canvas>
        <img class="layer still" id="still" alt="" draggable="false" />
        <canvas class="layer ink" id="still-ink"></canvas>
        <video class="layer vid" id="vid" muted playsinline preload="auto" disablepictureinpicture></video>
      </div>
      <div id="overlay" aria-hidden="true"></div>
      <div id="loading" aria-hidden="true"><div class="ring"></div></div>
    </main>
    <a id="wordmark" href="#" aria-label="RoboSimStudio">
      <svg viewBox="0 0 220 28" role="img" aria-hidden="true">
        <circle cx="12" cy="14" r="8" fill="#ff8c00" />
        <text x="28" y="20" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
              font-size="18" font-weight="650" letter-spacing="0.2" fill="currentColor">RoboSimStudio</text>
      </svg>
    </a>
    <nav id="picker" aria-label="Demos"></nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
